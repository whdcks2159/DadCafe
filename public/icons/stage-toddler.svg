<svg viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Head -->
  <circle cx="24" cy="9" r="7" fill="#FBB96E"/>
  <!-- Eyes -->
  <circle cx="21.5" cy="8" r="1.3" fill="#78350F"/>
  <circle cx="26.5" cy="8" r="1.3" fill="#78350F"/>
  <!-- Smile -->
  <path d="M21.5 11 Q24 13 26.5 11" stroke="#92400E" stroke-width="1.3" stroke-linecap="round" fill="none"/>
  <!-- Hair tuft -->
  <path d="M20 4 Q24 1 28 4" stroke="#92400E" stroke-width="2" stroke-linecap="round" fill="none"/>
  <!-- Body -->
  <rect x="18" y="17" width="12" height="14" rx="4" fill="#A78BFA"/>
  <!-- Left arm up (waving) -->
  <path d="M18 20 L10 12" stroke="#FBB96E" stroke-width="4" stroke-linecap="round"/>
  <circle cx="9" cy="11" r="3" fill="#FBB96E"/>
  <!-- Right arm -->
  <path d="M30 20 L36 24" stroke="#FBB96E" stroke-width="4" stroke-linecap="round"/>
  <circle cx="37" cy="25" r="3" fill="#FBB96E"/>
  <!-- Left leg -->
  <path d="M20 31 L17 44" stroke="#7C3AED" stroke-width="5" stroke-linecap="round"/>
  <!-- Right leg (stepping forward) -->
  <path d="M28 31 L32 43" stroke="#7C3AED" stroke-width="5" stroke-linecap="round"/>
  <!-- Shoes -->
  <ellipse cx="16" cy="44" rx="4" ry="2.5" fill="#4C1D95"/>
  <ellipse cx="33" cy="43" rx="4" ry="2.5" fill="#4C1D95"/>
</svg>
